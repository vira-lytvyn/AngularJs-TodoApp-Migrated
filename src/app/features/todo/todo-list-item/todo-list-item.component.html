<div class="row voffset1 note">
  <div class="col-xs-1 col">
    <app-checkbox
      [check]="todo.completed"
      (checkChange)="onToggle()"
    ></app-checkbox>
  </div>
  <div class="col-xs-10 col">
    <app-editable-label
      [(value)]="todo.text"
      (valueChange)="onEdit($event)"
    ></app-editable-label>
  </div>
  <div class="col-xs-1 col">
    <button class="btn btn-danger btn-xs" (click)="onDelete()">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>
