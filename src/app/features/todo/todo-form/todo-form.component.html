<form (ngSubmit)="onSubmit()" class="form-horizontal">
  <div class="form-group">
    <div class="col-xs-8">
      <input
        class="form-control input-lg"
        type="text"
        [(ngModel)]="newTodoTextValue"
        name="todoText"
        placeholder="Enter Todo"
      />
    </div>
    <div class="col-xs-4">
      <button type="submit" class="btn btn-primary btn-lg">Add Todo</button>
    </div>
  </div>
</form>
