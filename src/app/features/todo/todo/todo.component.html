<div class="container-fluid">
  <div class="jumbotron">
    <h1><i class="bi bi-list-task"></i> Todo App Example</h1>
  </div>
  <div class="row">
    <div class="col-md-6 col-xs-12">
      <div class="box">
        <h1><i class="bi bi-list-task"></i> Todo App</h1>
        <app-todo-form (add)="addTodo($event)"></app-todo-form>
        <ng-container *ngFor="let item of todos | todoFilter : criteria()">
          <app-todo-list-item
            [todo]="item"
            (toggle)="toggleCompleted(item)"
            (edit)="editTodo($event)"
            (delete)="delete(item)"
          ></app-todo-list-item>
        </ng-container>
        <div class="row" *ngIf="todos.length <= 0">
          <div class="col-xs-12">Please Add few Todos</div>
        </div>
        <div
          class="row"
          *ngIf="
            (todos | todoFilter : criteria()).length <= 0 && todos.length > 0
          "
        >
          <div class="col-xs-12">No Match Found</div>
        </div>
        <app-todo-filter-bar
          *ngIf="todos.length > 0"
          [criteria]="criteria()"
          (criteriaChange)="setCriteria($event)"
        ></app-todo-filter-bar>
        <app-todo-footer
          *ngIf="todos.length > 0"
          [completedCount]="(todos | todoFilter : 'completed')?.length ?? 0"
          (clearCompleted)="clearCompleted()"
        ></app-todo-footer>
      </div>
    </div>
    <div class="col-md-6 col-xs-12">
      <div class="box">
        <h1>App Description</h1>
        <p>
          This is a Todo App migrated from <code>AngularJS</code> to
          <code>Angular</code> using AI assistance.
        </p>
        Instructions -
        <ul>
          <li>Double click on the todo text to edit it</li>
        </ul>
      </div>
    </div>
  </div>
</div>
