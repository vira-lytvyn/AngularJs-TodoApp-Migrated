<span (dblclick)="enterEditMode()" style="width: 100%">
  <input
    type="text"
    *ngIf="editMode()"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    (keyup.enter)="commit()"
    (keyup.escape)="cancel()"
    #inputBox
  />
  <span class="text-left" *ngIf="!editMode()">{{ value }}</span>
</span>
